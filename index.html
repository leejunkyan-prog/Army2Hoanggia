<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1020">
<title>Cài đặt Army2HoangGia cho iPhone</title>
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#0b1221;font:16px system-ui,-apple-system,sans-serif;color:#f4f6fa}
  main{max-width:460px;width:100%;background:#172137;border:1px solid #34445f;border-radius:18px;padding:28px;text-align:center}
  h1{font-size:26px;margin:0 0 10px}p{color:#cbd5e1;line-height:1.6}
  a.install{display:block;text-decoration:none;color:#08111f;background:#f4ce4b;font-weight:800;padding:17px;border-radius:12px;margin:22px 0 12px;font-size:19px}
  small{color:#9eacc0;line-height:1.5;display:block}
</style>
</head>
<body>
<main>
<h1>Army2HoangGia iOS</h1>
<p id="status">Đang mở yêu cầu cài đặt trên iPhone…</p>
<a class="install" id="install" href="itms-services://?action=download-manifest&amp;url=https://raw.githubusercontent.com/leejunkyan-prog/Army2Hoanggia/main/manifest.plist">Cài đặt Army2HoangGia</a>
<small>Nếu chưa thấy hộp thoại cài đặt, hãy nhấn nút ở trên bằng Safari trên iPhone. IPA phải được ký hợp lệ và tải công khai qua HTTPS.</small>
</main>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var url = document.getElementById("install").href;
  if (ios) {
    window.setTimeout(function(){ window.location.href = url; }, 250);
  } else {
    document.getElementById("status").textContent = "Mở trang này bằng Safari trên iPhone để cài đặt.";
  }
})();
</script>
</body>
</html>
